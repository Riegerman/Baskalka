# Ulož tento soubor do repozitáře jako: .github/workflows/check-badminton.yml
#
# Jak nastavit Secrets (Settings -> Secrets and variables -> Actions -> New repository secret):
#   RESERVATION_USERNAME   - tvůj login na e-rezervace.cz
#   RESERVATION_PASSWORD   - tvé heslo
#   CALLMEBOT_PHONE        - tvé telefonní číslo ve formátu +420123456789
#   CALLMEBOT_APIKEY       - klíč, který dostaneš při aktivaci CallMeBot (viz návod v chatu)

name: Kontrola volných termínů badmintonu

on:
  schedule:
    # Spustí se každou hodinu (v minutu 0). Uprav "0 * * * *" podle potřeby.
    - cron: "0 * * * *"
  workflow_dispatch: {}  # umožní i ruční spuštění tlačítkem v GitHubu

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalovat závislosti
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Spustit kontrolu
        env:
          RESERVATION_USERNAME: ${{ secrets.RESERVATION_USERNAME }}
          RESERVATION_PASSWORD: ${{ secrets.RESERVATION_PASSWORD }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python check_badminton.py

      - name: Nahrát debug soubory (jen při chybě)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            debug.png
            debug.html
          retention-days: 3
